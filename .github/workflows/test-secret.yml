name: Test Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-secret.yml'

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ref secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "do dai secret = ${#KEYSTORE_B64}"
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/ks.jks
          ls -l /tmp/ks.jks
          keytool -list -keystore /tmp/ks.jks -storepass tooltx2024 -alias tooltx
