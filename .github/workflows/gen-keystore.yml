name: Gen keystore (tam)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tao keystore
        working-directory: tool-tx-android
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias tooltx \
            -storepass tooltx2024 -keypass tooltx2024 \
            -dname "CN=ToolTX, OU=Dev, O=LMT, L=HCMC, ST=HCMC, C=VN"

      - name: Xuat base64
        run: |
          base64 -w 0 tool-tx-android/app/release-keystore.jks > keystore.b64
          wc -c keystore.b64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64
