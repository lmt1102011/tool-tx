name: Build APK (kivy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-kivy/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer (.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('tool-tx-kivy/buildozer.spec') }}
          restore-keys: |
            buildozer-
          save-always: true

      - name: Build debug APK (ghcr.io/kivy/buildozer)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$GITHUB_WORKSPACE/tool-tx-kivy":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -v android debug 2>&1 | tee build.log

      - name: Dump build error (annotations)
        if: failure()
        shell: bash
        run: |
          STAGE=$(grep -nE 'Building .+|Running cython' build.log | tail -n 2 | tr '\n' ';')
          echo "::error::STAGE=$STAGE"
          ERR=$(grep -nE 'error:|Error|ERROR|Traceback|Exception|failed|no such file' build.log | tail -n 10 | tr '\n' ';' || true)
          echo "::error::ERRS=$ERR"
          echo "::error::TAIL=$(tail -n 5 build.log | tr '\n' ';' || true)"
          APKDIR=$(find .buildozer -name '*.apk' 2>/dev/null | head -n1 || true)
          echo "::error::APK=$APKDIR"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-apk
          path: tool-tx-kivy/bin/tooltx-*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Chạy APK trên Android 10 emulator và bắt logcat
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -o pipefail
            APK=$(ls tool-tx-kivy/bin/tooltx-*.apk | head -n 1)
            echo "INSERT_APK=$APK"
            adb install -r "$APK"
            adb shell am start -n org.lmt1102011.tooltx/org.kivy.android.PythonActivity
            sleep 55
            adb logcat -d -v threadtime > emulator-logcat.txt || true
            grep -nE "STEP |FATAL|AndroidRuntime|F DEBUG|backtrace|caused by|Exception|Error|Traceback|Kivy|kivy|main\.py|tooltx" emulator-logcat.txt | tail -n 220 > crash-lines.txt || true
            echo "===== SEARCH (220) ====="
            cat crash-lines.txt
            adb shell "run-as org.lmt1102011.tooltx cat /data/data/org.lmt1102011.tooltx/files/app/fault.log 2>/dev/null || run-as org.lmt1102011.tooltx cat files/fault.log 2>/dev/null" || true
            echo "===== crash.log in app ====="
            adb shell "run-as org.lmt1102011.tooltx cat /data/data/org.lmt1102011.tooltx/files/app/crash.log 2>/dev/null || run-as org.lmt1102011.tooltx cat files/crash.log 2>/dev/null" || true
            if grep -qiE "FATAL|AndroidRuntime" crash-lines.txt; then
              echo "CRASH_DETECTED"
              exit 1
            else
              echo "NO_FATAL_FOUND (xem logcat manual)"
            fi

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: emulator-logcat.txt
          retention-days: 7