name: Build APK (kivy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-kivy/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer (.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('tool-tx-kivy/buildozer.spec') }}
          restore-keys: |
            buildozer-
          save-always: true

      - name: Build debug APK (ghcr.io/kivy/buildozer)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$GITHUB_WORKSPACE/tool-tx-kivy":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -v android debug 2>&1 | tee build.log

      - name: Dump build error (annotations)
        if: failure()
        shell: bash
        run: |
          STAGE=$(grep -nE 'Building .+|Running cython' build.log | tail -n 2 | tr '\n' ';')
          echo "::error::STAGE=$STAGE"
          ERR=$(grep -nE 'error:|Error|ERROR|Traceback|Exception|failed|no such file' build.log | tail -n 10 | tr '\n' ';' || true)
          echo "::error::ERRS=$ERR"
          echo "::error::TAIL=$(tail -n 5 build.log | tr '\n' ';' || true)"
          APKDIR=$(find .buildozer -name '*.apk' 2>/dev/null | head -n1 || true)
          echo "::error::APK=$APKDIR"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-apk
          path: tool-tx-kivy/bin/tooltx-*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Chạy APK trên Android 10 emulator và bắt logcat
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            echo "=== EMU start ==="
            adb wait-for-device || echo "E1 wait fail"
            adb logcat -G 32M || echo "E0 size fail"
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do echo "boot chua xong, doi 5s"; sleep 5; done
            for n in 1 2 3 4 5; do RES=$(adb shell 'dumpsys activity activities 2>/dev/null | grep -m1 mResumedActivity'); echo "resumed[$n]=$RES"; echo "$RES" | grep -q "Launcher" && break; sleep 6; done
            echo "launcher da idle, doi 20s"
            sleep 20
            adb shell pm path android > /dev/null || echo "storage chua ready"
            APK=$(ls "$GITHUB_WORKSPACE"/tool-tx-kivy/bin/tooltx-*x86_64.apk 2>/dev/null | head -n 1)
            if [ -z "$APK" ]; then APK=$(ls "$GITHUB_WORKSPACE"/tool-tx-kivy/bin/tooltx-*.apk 2>/dev/null | head -n 1); fi
            echo "APK=$APK"
            adb install -r "$APK" || echo "E2 install fail"
            sleep 5
            adb logcat -c || echo "E3 clear fail"
            adb shell am start -W -n org.lmt1102011.tooltx/org.kivy.android.PythonActivity || echo "E5 start fail"
            echo "=== launch ack; sleeping 40 ==="
            sleep 40
            adb shell pidof org.lmt1102011.tooltx | tr -d '\r' > emu-pid.txt
            printf '::warning::EMU pid=%s\n' "$(cat emu-pid.txt)"
            adb shell ps -A 2>/dev/null | grep -Ei "tooltx|python|kivy" | head -5 > emu-ps.txt
            echo "PS:"; cat emu-ps.txt
            adb logcat -d -v threadtime > emulator-logcat.txt || echo "E6 dump fail"
            wc -l emulator-logcat.txt
            grep -niE "tooltx|PythonActivity|HELLO-A|KIVY-OK|RAN-OK|PY-EXC|STEP |Kivy v|jnius|SDL|FATAL EXCEPTION|F DEBUG|backtrace|signal (11|6|4)|Killing .*tooltx|lowmemorykiller|died|ANR in" emulator-logcat.txt > emu-scan.txt
            echo "== TAIL12:"; tail -12 emu-scan.txt
            echo "== HEAD12:"; head -12 emu-scan.txt
            tail -12 emu-scan.txt | while IFS= read -r line; do printf '::error::EMU-T %s\n' "$(printf '%s' "$line" | tr -d '\000-\011\013-\037' | cut -c1-450)"; done
            head -12 emu-scan.txt | while IFS= read -r line; do printf '::error::EMU-H %s\n' "$(printf '%s' "$line" | tr -d '\000-\011\013-\037' | cut -c1-450)"; done
            if [ ! -s emulator-logcat.txt ]; then printf '::error::EMU logcat EMPTY\n'; fi
            true

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: emulator-logcat.txt
          retention-days: 7