name: Build APK (kivy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-kivy/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer (.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('tool-tx-kivy/buildozer.spec') }}
          restore-keys: |
            buildozer-
          save-always: true

      - name: Build debug APK (ghcr.io/kivy/buildozer)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$GITHUB_WORKSPACE/tool-tx-kivy":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -v android debug 2>&1 | tee build.log

      - name: Dump build error (annotations)
        if: failure()
        shell: bash
        run: |
          FIRST=$(grep -n "no such file or directory" build.log | head -n1 | cut -d: -f1)
          S=$(grep -n "Running cython where appropriate" build.log | head -n1 | cut -d: -f1)
          echo "::error::FIRST_MISSING=$FIRST CY_START=$S N_CYTH=$(grep -c Cythonize build.log) CTX=$(sed -n $((FIRST-6)),$((FIRST+1))p build.log | tr ';' ' ' | tr '\n' ';')"
          echo "::error::ERR_BETW=$(grep -nE 'Cythonize|Traceback|Error|Exception|error:|illegal|fatal' build.log | awk -F: -v S=$S -v F=$FIRST '$1>S && $1<F' | tail -n 14 | tr '\n' ';')"
          echo "::error::CYTH_MISSING=$(for f in _clipboard_sdl2 audio_sdl2 cgl_gl cgl_mock text_layout; do grep -n Cythonize build.log | grep $f | tr '\n' ';'; done) TAIL=$(tail -n 4 build.log | tr '\n' ';')"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-apk
          path: tool-tx-kivy/bin/tooltx-*.apk
          retention-days: 14
          if-no-files-found: error