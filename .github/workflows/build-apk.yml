name: Build APK (kivy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-kivy/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK (buildozer)
        uses: Kivy/buildozer-action@v2
        with:
          working-directory: tool-tx-kivy
          buildozer-command: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-apk
          path: tool-tx-kivy/bin/tooltx-*.apk
          retention-days: 14