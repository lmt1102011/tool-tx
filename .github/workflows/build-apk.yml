name: Build APK (kivy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-kivy/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer (.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('tool-tx-kivy/buildozer.spec') }}
          restore-keys: |
            buildozer-
          save-always: true

      - name: Build debug APK (ghcr.io/kivy/buildozer)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$GITHUB_WORKSPACE/tool-tx-kivy":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -v android debug 2>&1 | tee build.log

      - name: Dump build error (annotations)
        if: failure()
        shell: bash
        run: |
          STAGE=$(grep -nE 'Building .+|Running cython' build.log | tail -n 2 | tr '\n' ';')
          echo "::error::STAGE=$STAGE"
          ERR=$(grep -nE 'error:|Error|ERROR|Traceback|Exception|failed|no such file' build.log | tail -n 10 | tr '\n' ';' || true)
          echo "::error::ERRS=$ERR"
          echo "::error::TAIL=$(tail -n 5 build.log | tr '\n' ';' || true)"
          APKDIR=$(find .buildozer -name '*.apk' 2>/dev/null | head -n1 || true)
          echo "::error::APK=$APKDIR"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-apk
          path: tool-tx-kivy/bin/tooltx-*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Chạy APK trên Android 10 emulator và bắt logcat
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            echo "=== EMU start ==="
            APK=$(ls "$GITHUB_WORKSPACE"/tool-tx-kivy/bin/tooltx-*.apk 2>/dev/null | head -n 1)
            echo "APK=$APK"
            adb wait-for-device || echo "adb wait FAIL"
            adb install -r "$APK" || echo "install FAIL"
            sleep 5
            adb logcat -c || echo "logcat clear FAIL"
            adb shell pm clear org.lmt1102011.tooltx || echo "pm clear FAIL"
            adb shell am start -n org.lmt1102011.tooltx/org.kivy.android.PythonActivity || echo "am start FAIL"
            echo "=== launch sent, sleeping 55 ==="
            sleep 55
            adb logcat -d -v threadtime > emulator-logcat.txt || echo "logcat dump FAIL"
            wc -l emulator-logcat.txt
            rm -f emulator-crash.txt
            { echo "== STACK =="
              grep -nE "FATAL EXCEPTION|F DEBUG|backtrace|Abort message|signal [0-9]+|crash_dump|SIGSEGV|SIGABRT|SIGBUS|SIGILL" emulator-logcat.txt | head -60
              echo "== ANDROID RUNTIME =="
              grep -nE "AndroidRuntime" emulator-logcat.txt | head -30
              echo "== STEP/KIVY =="
              grep -nE "STEP |Kivy v|Logger|Window|SDL|GL |pyjnius|jnius|tooltx|main.py" emulator-logcat.txt | tail -60
              echo "== FILES =="
              adb shell "run-as org.lmt1102011.tooltx find files -name '*' -type f" 2>/dev/null
              adb shell "run-as org.lmt1102011.tooltx cat files/app/fault.log" 2>/dev/null
              adb shell "run-as org.lmt1102011.tooltx cat files/app/crash.log" 2>/dev/null
            } >> emulator-crash.txt
            echo "===== CRASH SUMMARY (full) ====="
            cat emulator-crash.txt
            echo "===== first 8 for annotations ====="
            head -n 8 emulator-crash.txt | while IFS= read -r line; do printf '::warning::EMU | %s\n' "$(printf '%s' "$line" | sed 's/[^[:print:]]//g' | cut -c1-500)"; done
            if grep -qiE "FATAL EXCEPTION|AndroidRuntime" emulator-crash.txt; then
              printf '::error::EMU FATAL DETECTED — xem artifact emulator-logcat / crash summary o tren\n'
            else
              printf '::warning::EMU NO FATAL detected\n'
            fi
            true

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: emulator-logcat.txt
          retention-days: 7