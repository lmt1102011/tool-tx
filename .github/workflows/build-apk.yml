name: Build APK (kivy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-kivy/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer (.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('tool-tx-kivy/buildozer.spec') }}
          restore-keys: |
            buildozer-
          save-always: true

      - name: Build debug APK (ghcr.io/kivy/buildozer)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$GITHUB_WORKSPACE/tool-tx-kivy":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -v android debug 2>&1 | tee build.log

      - name: Dump build error (annotations)
        if: failure()
        shell: bash
        run: |
          echo "::error::==== 'error:' lines ===="
          grep -nE "error:" build.log | tail -n 8 | sed 's/^/::error::/'
          echo "::error::==== context before loi ===="
          grep -nE "Building |Compiling |longobject|PyLong_AsByteArray|Traceback|ERROR:|raise|Error " build.log | tail -n 12 | sed 's/^/::error::/'
          echo "::error::==== tail 12 ===="
          tail -n 12 build.log | sed 's/^/::error::/'

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-apk
          path: tool-tx-kivy/bin/tooltx-*.apk
          retention-days: 14
          if-no-files-found: error