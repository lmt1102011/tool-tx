name: Build APK (kivy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-kivy/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer (.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('tool-tx-kivy/buildozer.spec') }}

      - name: Build debug APK (ghcr.io/kivy/buildozer)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$GITHUB_WORKSPACE/tool-tx-kivy":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -v android debug 2>&1 | tee build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-apk
          path: tool-tx-kivy/bin/tooltx-*.apk
          retention-days: 14
          if-no-files-found: error