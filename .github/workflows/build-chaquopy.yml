name: Build APK (Chaquopy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-android/**'
      - '.github/workflows/build-chaquopy.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME_17_X64: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Generate Gradle Wrapper
        working-directory: tool-tx-android
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"
          GRADLEW
          chmod +x gradlew
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -qo /tmp/gradle.zip -d /opt/
          /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        working-directory: tool-tx-android
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Build Release APK
        working-directory: tool-tx-android
        if: success()
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-debug-apk
          path: tool-tx-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tooltx-apk
          path: tool-tx-android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn
