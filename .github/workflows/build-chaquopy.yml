name: Build APK (Chaquopy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool-tx-android/**'
      - '.github/workflows/build-chaquopy.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper (if missing)
        working-directory: tool-tx-android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Build Debug APK
        working-directory: tool-tx-android
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: tool-tx-android
        if: success()
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltx-debug-apk
          path: tool-tx-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tooltx-apk
          path: tool-tx-android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn
