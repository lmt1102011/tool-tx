<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Màn hình của bạn — TX Live 1:1</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(10,15,24,.92),rgba(10,15,24,0));padding:8px 10px;font-size:11.5px;color:#94a3b8;pointer-events:none}
#bar b{color:#e2e8f0}
#st.on{color:#6ee7b7}#st.err{color:#fca5a5}
#bar button{pointer-events:auto;background:rgba(245,200,66,.14);border:1px solid rgba(245,200,66,.4);color:#fde68a;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;cursor:pointer}
#fr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#scr{display:block;background:#000;box-shadow:0 0 0 1px #1e293b;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-drag:none}
#wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#64748b;font-size:13px;line-height:1.6;padding:20px}
#wait.hide{display:none}
</style>
</head>
<body>
<div id="bar">
  <span id="st">Đang kết nối...</span>
  <span style="flex:1"></span>
  <span>1:1 · chạm/click = thao tác Chrome của bạn</span>
  <button id="fs" title="F11">⛶ Fullscreen</button>
</div>
<div id="fr">
  <img id="scr" alt="">
  <div id="wait">Đang kết nối màn hình...<br>Đảm bảo bạn đã bấm <b>KẾT NỐI TOOL</b> ở trang chính.</div>
</div>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const st = $('st'), scr = $('scr'), wait = $('wait');
  let socket = null, token = '';
  try { token = sessionStorage.getItem('tx_token') || ''; } catch (_) {}
  if (!token) { st.textContent = 'Chưa đăng nhập — mở từ trang tool sau khi đăng nhập.'; st.className = 'err'; return; }

  function setMsg(t, cls) { st.textContent = t; st.className = cls || ''; }

  let serverUrl = location.origin;
  (async () => {
    try {
      const r = await fetch('./server-url.json?v=' + Date.now(), { cache: 'no-store' });
      const j = await r.json();
      if (j && typeof j.url === 'string' && j.url.trim()) serverUrl = j.url.trim();
    } catch (_) {}
    await loadIO();
  })();

  function loadIO() {
    if (window.io) return connect();
    const s = document.createElement('script');
    s.src = serverUrl + '/socket.io/socket.io.js';
    s.onload = connect;
    s.onerror = () => { setMsg('Không tải được socket.io từ ' + serverUrl + '. Bấm lại sau.', 'err'); setTimeout(() => { location.reload(); }, 2500); };
    document.head.appendChild(s);
  }

  function connect() {
    socket = io(serverUrl, { auth: { token }, transports: ['websocket', 'polling'] });
    socket.on('connect', () => setMsg('Đã kết nối — chờ phiên Chrome CDP của bạn...'));
    socket.on('user-status', (d) => {
      if (d && d.connected) { setMsg('✓ Chrome CDP của bạn đang chạy — thao tác tự do.'); wait.classList.add('hide'); }
      else { setMsg('Chưa có phiên: ' + (d && d.msg || 'bấm KẾT NỐI TOOL ở trang chính.')); st.className = ''; }
    });
    socket.on('screen', (buf) => {
      try {
        const blob = new Blob([buf], { type: 'image/jpeg' });
        if (scr.__url) URL.revokeObjectURL(scr.__url);
        scr.__url = URL.createObjectURL(blob);
        scr.src = scr.__url;
        if (!scr.dataset.ok) { scr.dataset.ok = '1'; wait.classList.add('hide'); scale(); setMsg('✓ Đang xem màn hình — chạm/click để thao tác.'); }
        if (scr.naturalWidth && (scr.dataset.w !== String(scr.naturalWidth))) scale();
      } catch (_) {}
    });
    socket.on('disconnect', (r) => { setMsg('Mất kết nối: ' + r, 'err'); wait.classList.remove('hide'); });
    socket.on('connect_error', (e) => { setMsg('Lỗi kết nối ' + (e.message || e), 'err'); wait.classList.remove('hide'); });
    bindInput();
  }

  function scale() {
    const nw = scr.naturalWidth, nh = scr.naturalHeight;
    if (!nw) return;
    scr.dataset.w = nw;
    const fw = window.innerWidth, fh = window.innerHeight - 0;
    const s = Math.min(fw / nw, fh / nh, 1);
    scr.style.width = Math.max(1, Math.floor(nw * s)) + 'px';
    scr.style.height = Math.max(1, Math.floor(nh * s)) + 'px';
  }

  function toNative(e) {
    const r = scr.getBoundingClientRect();
    const nw = scr.naturalWidth || r.width, nh = scr.naturalHeight || r.height;
    return {
      x: Math.round((e.clientX - r.left) * (nw / r.width)),
      y: Math.round((e.clientY - r.top) * (nh / r.height)),
    };
  }
  function send(evt) { try { if (socket && socket.connected) socket.emit('screenInput', evt); } catch (_) {} }

  let downMove = false, lastMove = 0;
  function bindInput() {
    scr.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      downMove = true;
      const p = toNative(e);
      send({ type: 'mousedown', x: p.x, y: p.y, button: e.button === 2 ? 'right' : 'left' });
    });
    window.addEventListener('pointerup', (e) => {
      if (!downMove) return;
      downMove = false;
      const p = toNative(e);
      send({ type: 'mouseup', x: p.x, y: p.y, button: e.button === 2 ? 'right' : 'left' });
    });
    scr.addEventListener('pointermove', (e) => {
      if (!downMove) return;
      const now = Date.now();
      if (now - lastMove < 30) return;
      lastMove = now;
      const p = toNative(e);
      send({ type: 'mousemove', x: p.x, y: p.y });
    });
    scr.addEventListener('wheel', (e) => { e.preventDefault(); const p = toNative(e); send({ type: 'wheel', x: p.x, y: p.y, deltaX: e.deltaX, deltaY: e.deltaY }); }, { passive: false });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11' || e.key === 'Escape') return;
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) send({ type: 'type', text: e.key });
      else send({ type: 'key', key: e.key === 'Enter' ? 'Enter' : e.key });
    });
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    $('fs').onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen().catch(()=>{}); else d.documentElement.requestFullscreen().catch(()=>{}); };
    window.addEventListener('resize', scale);
  }
})();
</script>
</body>
</html>
